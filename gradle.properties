## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Djava.awt.headless=true
kotlin.daemon.jvmargs=-Xmx3072M -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
org.gradle.configuration-cache=false
org.gradle.ide.support.future.agp.versions=true
android.nonTransitiveRClass=false
android.suppressUnsupportedCompileSdk=37.2

# Performance and memory balance
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Timeouts for downloads
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.java.net.useSystemProxies=true

# Disable caching for SNAPSHOT dependencies to avoid timeout issues
org.gradle.caching=false

# Fix KSP IllegalStateException: Storage for [...] is already registered
ksp.incremental=false
